# ==============================================================================
# CORA Network Isolation Configuration (network_isolation.conf)
# ==============================================================================
# Defines the default isolation level and the static interface allowlist for
# BLUE mode when no interfaces are explicitly specified on the CLI.
#
# Levels:
#   red   - Full host & WAN network stack access (Unrestricted)
#   white - Linux Network Namespace isolation (Loopback `lo` 127.0.0.1 only)
#   blue  - Interface-locked isolation (Only allowed interfaces + `lo` permitted)
#
# CLI Usage & Override Examples:
#   ./run_cora_NIX.sh cli -m 3.8 -netiso red
#   ./run_cora_NIX.sh cli -m 3.8 --network-isolation red
#   ./run_cora_NIX.sh cli -m 3.8 -netiso white
#   ./run_cora_NIX.sh cli -m 3.8 -netiso blue
#   ./run_cora_NIX.sh cli -m 3.8 -netiso blue eth0,eth1
#   ./run_cora_NIX.sh cli -m 3.8 --network-isolation blue eth0,eth1
# ==============================================================================

DEFAULT_ISOLATION_LEVEL="red"

# Statically assigned interfaces for BLUE mode (comma-separated).
# Any interfaces passed on the CLI (e.g., `-netiso blue eth0,eth1`) override this setting.
BLUE_ALLOWED_IFACES="eth0,eth1"

# Allowed USB Serial Console devices in BLUE mode (comma-separated).
BLUE_USB_DEVICES="/dev/ttyUSB0,/dev/ttyUSB1"
