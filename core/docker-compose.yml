# NOTE: Open WebUI (ghcr.io/open-webui/open-webui:main) has been replaced in CORA v5.15.12
# by the Custom CORA Svelte + TypeScript + Tailwind CSS + FastAPI WebUI located in:
#   core/webui/server.py  &  core/webui/frontend/
# Run directly on the host (with native NVML GPU + psutil telemetry & 15-Engine reasoning):
#   python core/webui/server.py --host 127.0.0.1 --port 1337
# or via:
#   .\run_cora_WIN.ps1 webgui  /  .\run_cora_WIN.ps1 webui  /  ./run_cora_NIX.sh webgui
services:
  cora-webui:
    image: python:3.11-slim
    container_name: local-cora-webui
    network_mode: host
    working_dir: /workspace/core
    command: python3 webui/server.py --host 127.0.0.1 --port 1337
    environment:
      - HOST=127.0.0.1
      - WEBUI_PORT=1337
      - LLAMA_PORT=8080
      - ACTIVE_MODEL_ALIAS=${ACTIVE_MODEL_ALIAS:-Qwen3.8-27B-Uncensored-Q3_K_M}
      - CORA_ACTIVE_PROJECT=${CORA_ACTIVE_PROJECT:-active_session}
    volumes:
      - ..:/workspace
    restart: unless-stopped
